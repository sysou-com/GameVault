# GameVault nginx 片段（插入 sysou.com 443 server 块；01 文档 §8）
# 部署事实：前缀 /game/；静态根 /var/www/gamevault/static/；游戏包根 /var/www/gamevault/games/
#
# ⚠️ COOP/COEP 作用域严格限制在 /game/ 前缀（02 文档 §5）：
#    /llm/ /EasyPCB/ /manage/ 等兄弟前缀响应**不得**带这两头（上线前 smoke.sh 抽样核对）。

# 平台前端静态（Vue 构建产物，vite --base=/game/）
location ^~ /game/ {
    alias /var/www/gamevault/static/;
    index index.html;
    try_files $uri $uri/ /game/index.html;
    add_header Cache-Control "no-store" always;            # HTML 禁缓存（兄弟工程同款事故教训）
    # COOP/COEP：使 /game/ 全域跨源隔离，iframe 内 SharedArrayBuffer 可用（02 文档 §5）
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location ~* \.(css|js|woff2?|png|jpg|jpeg|svg|webp|wasm|mp3|ogg|json)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

# 游戏静态包（发布管线的落位目录；02 文档 §6）
location ^~ /game/g/ {
    alias /var/www/gamevault/games/;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    types { application/wasm wasm; application/json json; }
}

# N0 预留（未启用）：原生游戏下载目录；N1 取消注释 + 建目录，详见 08 文档 §4
