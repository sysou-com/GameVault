# API（剥 /game 前缀 → 8094：/game/api/x → /api/x；注意 proxy_pass 路径必须为 /api/，
# 写成 / 会把 /game/api 整个剥掉 → /x 命中不到控制器（2026-10-23 部署实测踩坑））
location /game/api/ {
    proxy_pass http://127.0.0.1:8094/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 100m;              # 管理台上传游戏包
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    # M5 对战 WebSocket（弹珠对轰）：
    # proxy_upgrade websocket;
    # proxy_set_header Upgrade $http_upgrade;
    # proxy_set_header Connection "upgrade";
    # proxy_read_timeout 3600s;
}
location = /game { return 301 /game/; }
