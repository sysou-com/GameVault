# GameVault nginx 片段（插入 /etc/nginx/nginx.conf 的 **www.sysou.com** 443 server 块——与兄弟服务同款；
# apex sysou.com 块是纯 308→www 重定向，server 级 return 会吃掉一切 location，勿插那里；01 文档 §8）
# 部署事实：前缀 /game/；前端根 /var/www/gamevault/static/；游戏包根 /var/www/gamevault/games/
#
# 实现说明（2026-10-23 部署修正，nginx 实测踩坑）：
#   - alias 只在声明它的 location 生效：原版嵌套正则缓存 location（css/js…）无 alias/root →
#     所有 SPA 静态资源 404。M1 去嵌套 location：SPA 资源 no-store（内容哈希文件名，无正确性风险，
#     缓存优化留 M2）；游戏包目录 /game/g/ 自带 30d 缓存。
#   - /game/g/ 是普通前缀（非 ^~）：让 SPA 路由正则能抢先；真实资源 3 段以上正则不中 → 落游戏包目录。
#   - /game/g/ 下不用 try_files（alias + try_files 为 nginx 已知不可靠组合）：默认文件匹配，缺失 404。
#   - types 块整体覆盖默认 mime 映射：必须列全资产类型（见下方注释）。
#   - ⚠️ COOP/COEP 作用域严格限制在 /game/ 前缀（02 文档 §5）：
#     /llm/ /EasyPCB/ /manage/ 等兄弟前缀响应**不得**带这两头（上线前 smoke.sh 抽样核对）。

# 平台前端静态（Vue 构建产物，vite --base=/game/）
location ^~ /game/ {
    alias /var/www/gamevault/static/;
    index index.html;
    try_files $uri $uri/ /game/index.html;
    add_header Cache-Control "no-store" always;            # HTML 禁缓存（兄弟工程同款事故教训）
    # COOP/COEP：使 /game/ 全域跨源隔离，iframe 内 SharedArrayBuffer 可用（02 文档 §5）
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
}

# 前端 SPA 路由（01 文档 §4：/game/g/:slug 详情+试玩、/game/g/:slug/board 榜单 M2）→ 平台 index.html。
# 真实游戏资源 3 段以上（{slug}/{ver}/…），正则不中 → 落下方游戏包目录。
# 配套约束：下方 /game/g/ 必须是普通前缀（不能 ^~），否则 ^~ 会屏蔽正则。
location ~ ^/game/g/[^/]+(/board)?/?$ {
    rewrite ^ /game/index.html;   # 内部重定向 → 命中 ^~ /game/（no-store + COOP/COEP 头）
}

# 游戏静态包（发布管线的落位目录；02 文档 §6）
location /game/g/ {
    alias /var/www/gamevault/games/;
    expires 30d;
    add_header Cache-Control "public";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # ⚠️ types 块会整体覆盖默认 mime 映射：必须列全游戏包资产类型，否则 html/js 落 application/octet-stream
    types {
        text/html html;
        application/javascript js;
        text/css css;
        application/json json;
        application/wasm wasm;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg;
        audio/ogg ogg;
        audio/mpeg mp3;
    }
}

# N0 预留（未启用）：原生游戏下载目录；N1 取消注释 + 建目录，详见 08 文档 §4
# location ^~ /game/dl/ {
