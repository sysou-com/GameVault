<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>霓虹突袭 · Neon Raid</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2304060f'/%3E%3Cpolygon points='2,4 13,8 2,12 5,8' fill='%2312f0ff'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; background: #04060f; overflow: hidden; }
    #game { display: block; width: 100%; height: 100%; touch-action: none; }
    /* 霓虹扫描线后处理（03 文档 §1.4：CSS 覆盖层，不走 shader） */
    #scanlines {
      position: fixed; inset: 0; pointer-events: none; z-index: 9; opacity: 0.16;
      background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.55) 2px 3px);
      mix-blend-mode: multiply;
    }
    #vig {
      position: fixed; inset: 0; pointer-events: none; z-index: 8;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(2,4,12,0.55) 100%);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vig"></div>
  <div id="scanlines"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
